owner:
  group: idc-on-call-automation-discovery
notify:
  slack:
    channelName: traceception-ops
profiles:
  - node

setup:
  releaseRefs: ["main"]
  featureFlagMap:
    useArtifactory: true
    imageValidation: false

build:
  artifact: traceception-dashboard
  docker:
    app:
      runtime: node
      dockerFile: ./DockerFile

deploy:
  gslb:
    enabled: true
    httpsRedirect: true
    httpPortEnabled: true
    httpsPortEnabled: true
    lbRoutings:
      stage:
        cnames:
          - "traceception-analytics-stg.walmart.com"
  namespace: project-traceception
  stages:
  - name: stage
    target:
      - cluster_id: "uscentral-stage-az-302"
  helm:
    values:
      min:
        cpu: 1
        memory: 1024Mi
      max:
        cpu: 2
        memory: 2048Mi
      readinessProbe:
        enabled: "true"
        headers: application/json, text/plain, text/html
        probeInterval: 30
        wait: 100
        path: "/"
        timeoutSeconds: 5
        port: 8080
        failureThreshold: 3
        initialDelaySeconds: 20
      livenessProbe:
        enabled: "true"
        headers: application/json, text/plain, text/html
        probeInterval: 30
        wait: 110
        path: "/"
        port: 8080
        failureThreshold: 3
        initialDelaySeconds: 20
        timeoutSeconds: 5
      networking:
        httpsEnabled: true
        httpsRedirect: false
        pathPrefix: /
        externalPort: 8080
        internalPort: 8080
        gslbdnszone: k8s.glb.us.walmart.net
      scaling:
        enabled: false
        min: 1
        max: 1
      

     